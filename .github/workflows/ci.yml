name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTASKFORGE_WARNINGS_AS_ERRORS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Verify production warning-as-error scope
        env:
          AUDIT_LABEL: GCC_CI
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          label = os.environ["AUDIT_LABEL"]
          root = Path.cwd().resolve()
          commands = json.loads((root / "build" / "compile_commands.json").read_text())
          groups = {"production": [], "tests": [], "bench": []}
          for entry in commands:
              relative = Path(entry["file"]).resolve().relative_to(root)
              command = entry["command"]
              if relative.parts[0] == "src":
                  groups["production"].append(command)
              elif relative.parts[0] == "tests":
                  groups["tests"].append(command)
              elif relative.parts[0] == "bench":
                  groups["bench"].append(command)

          assert groups["production"], "no production compile commands found"
          assert groups["tests"], "no test/helper compile commands found"
          assert groups["bench"], "no benchmark compile commands found"
          assert all("-Werror" in command.split() for command in groups["production"])
          assert not any("-Werror" in command.split() for command in groups["tests"])
          assert not any("-Werror" in command.split() for command in groups["bench"])
          print(f"{label}_WERROR_VERIFIED=YES")
          print(f"{label}_WERROR_SCOPE=PRODUCTION_ONLY")
          PY
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: cgroup v2 kernel integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers)"
          for controller in cpu memory pids; do
            grep -qw "$controller" <<<"$controllers"
          done
          # Hosted runners may expose controllers at the cgroup root without
          # delegating them to children. Enable only the three Phase 6
          # controllers before creating this workflow-scoped subtree.
          sudo sh -c "printf '%s' '+cpu +memory +pids' > /sys/fs/cgroup/cgroup.subtree_control"
          root="/sys/fs/cgroup/taskforge-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { sudo rmdir "$root" 2>/dev/null || true; }
          trap cleanup EXIT
          sudo mkdir "$root"
          sudo sh -c "printf '%s' '+cpu +memory +pids' > '$root/cgroup.subtree_control'"
          sudo env TASKFORGE_CGROUP_TEST_ROOT="$root" \
            ctest --test-dir build --output-on-failure -R '^taskforge.cgroup_v2_integration$'

  clang-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Debug -DTASKFORGE_WARNINGS_AS_ERRORS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Verify Clang compiler
        run: |
          grep -Eq 'set\(CMAKE_CXX_COMPILER_ID "Clang"\)' build-clang/CMakeFiles/*/CMakeCXXCompiler.cmake
          echo 'CLANG_CI_COMPILER_VERIFIED=YES'
      - name: Verify production warning-as-error scope
        env:
          AUDIT_LABEL: CLANG_CI
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          label = os.environ["AUDIT_LABEL"]
          root = Path.cwd().resolve()
          commands = json.loads((root / "build-clang" / "compile_commands.json").read_text())
          groups = {"production": [], "tests": [], "bench": []}
          for entry in commands:
              relative = Path(entry["file"]).resolve().relative_to(root)
              command = entry["command"]
              if relative.parts[0] == "src":
                  groups["production"].append(command)
              elif relative.parts[0] == "tests":
                  groups["tests"].append(command)
              elif relative.parts[0] == "bench":
                  groups["bench"].append(command)

          assert groups["production"], "no production compile commands found"
          assert groups["tests"], "no test/helper compile commands found"
          assert groups["bench"], "no benchmark compile commands found"
          assert all("-Werror" in command.split() for command in groups["production"])
          assert not any("-Werror" in command.split() for command in groups["tests"])
          assert not any("-Werror" in command.split() for command in groups["bench"])
          print(f"{label}_WERROR_VERIFIED=YES")
          print(f"{label}_WERROR_SCOPE=PRODUCTION_ONLY")
          PY
      - name: Build
        run: cmake --build build-clang --parallel
      - name: Test non-privileged registry
        run: ctest --test-dir build-clang --output-on-failure -E '^taskforge.cgroup_v2_integration$'

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DTASKFORGE_ENABLE_ASAN_UBSAN=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test non-privileged registry
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure -E '^taskforge.cgroup_v2_integration$'

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DTASKFORGE_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Test parent-process concurrency
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure -R '^(taskforge.task_state|taskforge.concurrent_executor)$'
